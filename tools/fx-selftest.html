<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fx selftest</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three'
import { rng } from '/src/core/util.js'
import Gtao from '/src/render/passes/gtao.js'
import Ssr from '/src/render/passes/ssr.js'
import Volumetric from '/src/render/passes/volumetric.js'
import Bloom from '/src/render/passes/bloom.js'
import Dof from '/src/render/passes/dof.js'
import MotionBlur from '/src/render/passes/motionblur.js'
import { QUALITY, LOOK } from '/src/core/config.js'

const W = 1280, H = 720, DPR = 2
const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, stencil: false, depth: true })
renderer.setPixelRatio(DPR)
renderer.setSize(W, H, false)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.NoToneMapping
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.VSMShadowMap
renderer.info.autoReset = false

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 200)
camera.position.set(0.9, 1.62, 9.0)
camera.lookAt(0, 1.35, -6)

const r = rng(7)
const rr = (a, b) => a + (b - a) * r()

function pbr (color, rough, metal) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: rough, metalness: metal })
}
function box (w, h, d, mat, x, y, z, ry) {
  const g = new THREE.BoxGeometry(w, h, d, 1, 1, 1)
  const m = new THREE.Mesh(g, mat)
  m.position.set(x, y, z)
  if (ry) m.rotation.y = ry
  m.castShadow = true; m.receiveShadow = true
  scene.add(m)
  return m
}

// 복도: 젖은 대리석 바닥(매끈) + 벽 + 천장
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 40), pbr(0x2b2a28, 0.09, 0.0))
floor.rotation.x = -Math.PI / 2
floor.receiveShadow = true
scene.add(floor)
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(14, 40), pbr(0x1a1815, 0.85, 0))
ceil.rotation.x = Math.PI / 2
ceil.position.y = 3.1
ceil.receiveShadow = true
scene.add(ceil)
for (const s of [-1, 1]) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(40, 3.1), pbr(0x3a3026, 0.72, 0))
  w.rotation.y = -s * Math.PI / 2
  w.position.set(s * 2.6, 1.55, -6)
  w.receiveShadow = true
  scene.add(w)
}
// 복도 끝 벽 (안개 소멸 확인용 원경)
box(5.2, 3.1, 0.3, pbr(0x322a20, 0.8, 0), 0, 1.55, -25)

// 접지·컨택트 섀도 확인용 소품
const brass = pbr(0xb08d3f, 0.22, 1.0)
const wood = pbr(0x4a2f1c, 0.42, 0)
for (let i = 0; i < 7; i++) {
  const z = -1.5 - i * 3.0
  box(0.34, 0.34, 0.34, i % 2 ? brass : wood, rr(-1.7, 1.7), 0.17, z + rr(-0.4, 0.4), rr(0, 3))
  box(0.16, 1.1, 0.16, wood, (i % 2 ? -1 : 1) * 2.35, 0.55, z, 0)
}
box(1.1, 0.72, 0.5, wood, -1.5, 0.36, 2.0, 0.3)
const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.38, 48, 32), pbr(0xdadada, 0.06, 0.9))
sphere.position.set(1.3, 0.38, 3.4)
sphere.castShadow = true; sphere.receiveShadow = true
scene.add(sphere)

// 광축을 만들 슬랫(블라인드) — 스포트라이트와 바닥 사이를 가른다
for (let i = 0; i < 9; i++) {
  box(4.6, 0.08, 0.16, pbr(0x151312, 0.9, 0), 0, 2.62, -3.2 - i * 0.42, 0)
}

// 조명: 색온도 2개 이상 (텅스텐 스포트 + 달빛 디렉셔널)
const spot = new THREE.SpotLight(0xffb46b, 260, 26, 0.62, 0.45, 2)
spot.position.set(0.2, 3.02, -2.0)
spot.target.position.set(-0.3, 0, -9.0)
spot.castShadow = true
spot.shadow.mapSize.set(1024, 1024)
spot.shadow.camera.near = 0.4
spot.shadow.camera.far = 30
spot.shadow.bias = -0.0007
spot.shadow.radius = 3
spot.shadow.blurSamples = 8
scene.add(spot, spot.target)

const moon = new THREE.DirectionalLight(0x9fc4ff, 1.6)
moon.position.set(-7, 6, -16)
moon.target.position.set(0, 0.6, -6)
moon.castShadow = true
moon.shadow.mapSize.set(1024, 1024)
moon.shadow.camera.near = 1
moon.shadow.camera.far = 40
moon.shadow.camera.left = -9; moon.shadow.camera.right = 9
moon.shadow.camera.top = 9; moon.shadow.camera.bottom = -9
moon.shadow.bias = -0.0009
moon.shadow.radius = 4
moon.shadow.blurSamples = 8
scene.add(moon, moon.target)

// 블룸 확인용 실광원 오브젝트
const bulbMat = new THREE.MeshStandardMaterial({ color: 0x120c05, emissive: new THREE.Color(0xffc98a), emissiveIntensity: 14 })
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 14), bulbMat)
bulb.position.set(-2.3, 2.35, 1.4)
scene.add(bulb)
const sconce = new THREE.PointLight(0xffbb77, 6, 7, 2)
sconce.position.copy(bulb.position)
scene.add(sconce)
scene.add(new THREE.AmbientLight(0x2b3444, 0.35))

// ── 타깃 ───────────────────────────────────────────────
const bw = Math.round(W * DPR), bh = Math.round(H * DPR)
function mk (w, h, opt) {
  const t = new THREE.WebGLRenderTarget(w, h, Object.assign({
    format: THREE.RGBAFormat, type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: false, generateMipmaps: false
  }, opt || {}))
  t.texture.colorSpace = THREE.NoColorSpace
  return t
}
const hdr = mk(bw, bh, { depthBuffer: true })
hdr.depthTexture = new THREE.DepthTexture(bw, bh)
hdr.depthTexture.format = THREE.DepthFormat
hdr.depthTexture.type = THREE.UnsignedIntType
const normal = mk(bw, bh, { depthBuffer: true })
const velocity = mk(bw, bh, { format: THREE.RGFormat })
const ao = mk(bw, bh, { format: THREE.RedFormat, type: THREE.UnsignedByteType })
const ssrT = mk(bw, bh)
const volT = mk(bw, bh)
const bloomT = mk(bw, bh)

const noiseData = new Uint8Array(64 * 64)
const nr = rng(1337)
for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.floor(nr() * 256)
const blueNoise = new THREE.DataTexture(noiseData, 64, 64, THREE.RedFormat, THREE.UnsignedByteType)
blueNoise.minFilter = blueNoise.magFilter = THREE.NearestFilter
blueNoise.needsUpdate = true

const normalMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vN; varying float vD;
    void main () {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal); vD = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vN; varying float vD;
    void main () { gl_FragColor = vec4(normalize(vN), vD); }`
})

const quadScene = new THREE.Scene()
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
const quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null)
quadMesh.frustumCulled = false
quadScene.add(quadMesh)
function fsq (mat, target) {
  quadMesh.material = mat
  const a = renderer.autoClear
  renderer.autoClear = false
  renderer.setRenderTarget(target ?? null)
  renderer.render(quadScene, quadCam)
  renderer.autoClear = a
}

const compMat = new THREE.ShaderMaterial({
  uniforms: {
    uHdr: { value: hdr.texture }, uAo: { value: ao.texture }, uSsr: { value: ssrT.texture },
    uVol: { value: volT.texture }, uBloom: { value: bloomT.texture },
    uNormal: { value: normal.texture }, uMode: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uHdr, uAo, uSsr, uVol, uBloom, uNormal;
    uniform float uMode;
    vec3 tone (vec3 x) {
      x = max(x, vec3(0.0));
      x = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
      return pow(x, vec3(1.0 / 2.2));
    }
    void main () {
      vec2 uv = vUv;
      int m = int(uMode + 0.5);
      if (m == 1) { gl_FragColor = vec4(tone(texture2D(uHdr, uv).rgb), 1.0); return; }
      if (m == 2) { gl_FragColor = vec4(vec3(texture2D(uAo, uv).r), 1.0); return; }
      if (m == 3) { vec4 s = texture2D(uSsr, uv); gl_FragColor = vec4(tone(s.rgb * s.a * 8.0), 1.0); return; }
      if (m == 4) { gl_FragColor = vec4(tone(texture2D(uVol, uv).rgb * 6.0), 1.0); return; }
      if (m == 5) { gl_FragColor = vec4(vec3(texture2D(uVol, uv).a), 1.0); return; }
      if (m == 6) { gl_FragColor = vec4(tone(texture2D(uBloom, uv).rgb * 6.0), 1.0); return; }
      if (m == 7) { gl_FragColor = vec4(texture2D(uNormal, uv).rgb * 0.5 + 0.5, 1.0); return; }
      vec3 c = texture2D(uHdr, uv).rgb;
      c *= mix(1.0, texture2D(uAo, uv).r, 0.85);
      vec4 s = texture2D(uSsr, uv);
      c += s.rgb * s.a;
      vec4 v = texture2D(uVol, uv);
      c = c * v.a + v.rgb;
      c += texture2D(uBloom, uv).rgb;
      gl_FragColor = vec4(tone(c), 1.0);
    }`,
  depthTest: false, depthWrite: false
})

const passes = {
  gtao: new Gtao(), ssr: new Ssr(), volumetric: new Volumetric(),
  bloom: new Bloom(), dof: new Dof(), motionblur: new MotionBlur()
}

const ctx = {
  engine: { time: 0 }, renderer, scene, camera,
  w: bw, h: bh,
  targets: { hdr, hdrPrev: null, normal, velocity, ao, ssr: ssrT, vol: volT, bloom: bloomT },
  depthTexture: hdr.depthTexture,
  frame: 0,
  jitter: { x: 0, y: 0 },
  matrices: {
    proj: new THREE.Matrix4(), invProj: new THREE.Matrix4(), view: new THREE.Matrix4(),
    invView: new THREE.Matrix4(), viewProj: new THREE.Matrix4(), prevViewProj: new THREE.Matrix4()
  },
  quality: QUALITY.cinematic, look: LOOK,
  blueNoise,
  fsq
}

for (const p of Object.values(passes)) { await p.init(ctx); p.setSize(bw, bh, ctx) }

function frame (dt) {
  ctx.engine.time += dt
  ctx.frame++
  camera.updateMatrixWorld(true)
  ctx.matrices.prevViewProj.copy(ctx.matrices.viewProj)
  ctx.matrices.proj.copy(camera.projectionMatrix)
  ctx.matrices.invProj.copy(camera.projectionMatrixInverse)
  ctx.matrices.view.copy(camera.matrixWorldInverse)
  ctx.matrices.invView.copy(camera.matrixWorld)
  ctx.matrices.viewProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)

  renderer.setRenderTarget(velocity)
  renderer.setClearColor(0x000000, 0)
  renderer.clear(true, false, false)

  scene.overrideMaterial = normalMat
  renderer.setRenderTarget(normal)
  renderer.autoClear = true
  renderer.clear()
  renderer.render(scene, camera)
  scene.overrideMaterial = null

  renderer.setRenderTarget(hdr)
  renderer.clear()
  renderer.render(scene, camera)

  passes.gtao.render(ctx)
  passes.ssr.render(ctx)
  passes.volumetric.render(ctx)
  passes.motionblur.render(ctx)
  passes.dof.render(ctx)
  passes.bloom.render(ctx)

  compMat.uniforms.uMode.value = MODES.indexOf(window.__MODE__)
  fsq(compMat, null)
  window.__CALLS__ = renderer.info.render.calls
  renderer.info.reset()
}

const MODES = ['final', 'hdr', 'ao', 'ssr', 'vol', 'volA', 'bloom', 'normal']
window.__FX__ = {
  ready: true,
  step (n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) frame(dt) },
  stats () { return { calls: window.__CALLS__, tris: renderer.info.render.triangles } },
  setMode (m) { window.__MODE__ = m },
  setCam (p, t, fov) {
    camera.position.set(p[0], p[1], p[2])
    if (fov) { camera.fov = fov; camera.updateProjectionMatrix() }
    camera.lookAt(t[0], t[1], t[2])
    camera.updateMatrixWorld(true)
  }
}
window.__MODE__ = 'final'
frame(1 / 60)
</script>
</body>
</html>
